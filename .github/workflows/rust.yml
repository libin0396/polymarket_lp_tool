name: rust

on:
  push:
    paths:
      - "rust_mm_bot/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "rust_mm_bot/**"
      - ".github/workflows/rust.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_mm_bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust_mm_bot/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust_mm_bot/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo build --release
